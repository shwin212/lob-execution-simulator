[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-execution-simulator"
version = "0.1.0"
description = "Reproducible NASDAQ ITCH order book replay and execution simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project Contributor"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
plots = ["matplotlib>=3.7"]

[project.scripts]
lob-sim = "lob_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
