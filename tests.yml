name: Tests and Python-C++ parity
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m lob_sim demo --out-dir sample --events 5000 --seed 7
      - run: make cpp
      - run: make parity
      - run: python -m lob_sim backtest --input sample/demo.csv --strategy maker
      - run: python -m lob_sim backtest --input sample/demo.csv --strategy vwap
